<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Browser Favicons -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg">

  <!-- iOS / Apple Home Screen Icons -->
  <link rel="apple-touch-icon" href="/logo.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/logo.svg">

  <!-- Social Media Sharing (Open Graph) - 1200x630 Centered Logo -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elachef.app/">
  <meta property="og:title" content="ElaChef - From Pantry to Plate, Instantly.">
  <meta property="og:description" content="AI-powered kitchen management. Scan your fridge and start cooking instantly with whatever is in stock.">
  <meta property="og:image" content="/logo.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Manifest Integration -->
  <link rel="manifest" href="manifest.json?v=8">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;900&display=swap');
    body { 
      font-family: 'Poppins', sans-serif; 
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      background-color: #000000;
      color: #f4f4f5;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
    
    #splash {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      width: 80px;
      height: 80px;
      background: #22C55E;
      filter: blur(50px);
      opacity: 0.2;
      animation: pulse-glow 2s infinite alternate;
    }

    @keyframes pulse-glow {
      from { opacity: 0.1; transform: scale(0.8); }
      to { opacity: 0.35; transform: scale(1.2); }
    }

    @keyframes loading-bar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "recharts": "https://esm.sh/recharts@^3.7.0",
      "react/": "https://esm.sh/react@^19.2.4/",
      "react": "https://esm.sh/react@^19.2.4",
      "@google/genai": "https://esm.sh/@google/genai@^1.39.0"
    }
  }
  </script>
</head>
<body class="bg-black text-zinc-100">
  <div id="splash">
    <div class="logo-container mb-8">
      <div class="logo-glow"></div>
      <svg viewBox="0 0 100 100" class="w-24 h-24 text-green-500 relative z-10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="20" width="10" height="60" rx="2" fill="currentColor" />
        <g>
          <rect x="30" y="22" width="35" height="6" rx="1" fill="currentColor" />
          <ellipse cx="75" cy="25" rx="12" ry="9" fill="currentColor" />
        </g>
        <g>
          <rect x="30" y="47" width="35" height="6" rx="1" fill="currentColor" />
          <rect x="65" y="42" width="4" height="16" rx="1" fill="currentColor" />
          <rect x="69" y="42" width="18" height="2.5" rx="0.5" fill="currentColor" />
          <rect x="69" y="48.75" width="18" height="2.5" rx="0.5" fill="currentColor" />
          <rect x="69" y="55.5" width="18" height="2.5" rx="0.5" fill="currentColor" />
        </g>
        <g>
          <rect x="30" y="72" width="35" height="6" rx="1" fill="currentColor" />
          <path d="M65 72L85 72C85 72 85 82 65 82L65 72Z" fill="currentColor" />
        </g>
      </svg>
    </div>
    <div class="text-center space-y-2">
      <h1 class="font-black text-3xl tracking-tighter text-white">ElaChef</h1>
      <p id="splash-tagline" class="text-[10px] text-zinc-600 font-black uppercase tracking-[0.4em]">From Pantry to Plate, Instantly</p>
    </div>
    <div class="w-16 h-1 bg-zinc-900 mt-10 rounded-full overflow-hidden">
      <div class="h-full bg-green-500 w-1/3 animate-[loading-bar_1.2s_infinite_linear]"></div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    const taglines = [
      "Cook Smarter, Not Harder",
      "From Pantry to Plate, Instantly",
      "Delicious Made Easy",
      "Smart Cooking, Instant Meals",
      "Turn Ingredients into Magic"
    ];

    window.addEventListener('load', () => {
      const taglineEl = document.getElementById('splash-tagline');
      if (taglineEl) {
        const randomTag = taglines[Math.floor(Math.random() * taglines.length)];
        taglineEl.textContent = randomTag;
      }

      const splash = document.getElementById('splash');
      setTimeout(() => {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }, 1800);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            console.log('SW registered', reg.scope);
          })
          .catch(err => console.warn('SW registration failed:', err));
      }
    });
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
